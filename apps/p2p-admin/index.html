<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OSIRIS EYE · Founder Admin</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9f0ff;background:#091322}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#101f32;padding:24px 14px;border-right:1px solid #304056}h1{font-size:18px;margin:0 10px 8px}small{color:#9bb0cb}nav{display:grid;gap:7px;margin-top:25px}button{background:#162a42;color:#eaf3ff;border:1px solid #334a64;border-radius:9px;padding:11px;text-align:left;cursor:pointer}button[aria-current="page"]{background:#136e6e;border-color:#39bcb1}main{padding:28px;max-width:1150px;width:100%}.notice{padding:12px;border:1px solid #876b3e;border-radius:8px;color:#ffdba0;background:#2a251e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:20px 0}.card{border:1px solid #30465f;background:#112338;border-radius:12px;padding:18px}.card h3{margin:0 0 10px}.pill{font-size:12px;color:#a6f4d9}input{accent-color:#24c1a7}label{display:block;margin:14px 0}input[type=text]{padding:10px;background:#0b192b;border:1px solid #45607b;color:white;border-radius:7px;width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{background:#116d67}pre{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:700px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #304056}nav{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}}</style></head>
<body><div class="shell"><aside><h1>◈ OSIRIS EYE</h1><small>FOUNDER CONTROL · LOCAL PROTOTYPE</small><nav id="nav"></nav></aside><main><div class="notice">PROTOTYPE ONLY — no live P2P connection, authenticated access, or remote control. Draft settings remain in this page until refreshed.</div><h2 id="heading">Overview</h2><p id="description"></p><div id="content"></div></main></div>
<script>
const modules=[["overview","Overview","Read-only network status"],["nodes","Owned Nodes","Manage organization-owned nodes only"],["peers","Peer Health","Connection evidence and diagnostics"],["crypto","Cryptography Policy","Review encryption settings; no private key access"],["releases","Protocol Releases","Signed releases and rollback"],["security","Security Audit","Permissions and immutable audit logs"],["features","Feature Manager","Prepare future module flags"],["billing","Business & Revenue","Commercial services"],["settings","System Settings","Versioned draft configuration"]];
const state={version:1,brand:"OSIRIS EYE",flags:{monitoring:true,managedNodes:false,billing:false}};
let selected="overview";
const nav=document.getElementById("nav"),content=document.getElementById("content");
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function render(){nav.replaceChildren();modules.forEach(([id,title])=>{const b=el("button",title);if(selected===id)b.setAttribute("aria-current","page");b.onclick=()=>{selected=id;render()};nav.append(b)});
const item=modules.find(x=>x[0]===selected);document.getElementById("heading").textContent=item[1];document.getElementById("description").textContent=item[2];content.replaceChildren();
if(selected==="overview"){const grid=el("div","");grid.className="grid";for(const [title,value] of [["Network","Not connected"],["Active Peers","Not verified"],["Release","Not connected"],["Admin Security","Authentication not implemented"]]){const card=el("div","");card.className="card";card.append(el("h3",title),el("p",value));grid.append(card)}content.append(grid)}
else if(selected==="features"){const card=el("section","");card.className="card";card.append(el("h3","Draft feature flags"));Object.keys(state.flags).forEach(key=>{const label=el("label","");const input=document.createElement("input");input.type="checkbox";input.checked=state.flags[key];input.onchange=()=>{state.flags[key]=input.checked};label.append(input,document.createTextNode(" "+key));card.append(label)});content.append(card)}
else if(selected==="settings"){const card=el("section","");card.className="card";card.append(el("h3","Versioned local draft"));const input=document.createElement("input");input.type="text";input.value=state.brand;input.maxLength=80;input.setAttribute("aria-label","Brand");input.oninput=()=>state.brand=input.value;card.append(el("label","Brand name"),input,el("p","Changes are local only. No network settings are changed."));content.append(card)}
else{const card=el("section","");card.className="card";card.append(el("h3","Module reserved for future implementation"),el("p","Requires server-side authentication, scoped authorization, signed configuration and audited APIs before any live action."));content.append(card)}
const actions=el("div","");actions.className="actions";const exportBtn=el("button","Export draft JSON");exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="osiris-admin-draft.json";a.click();URL.revokeObjectURL(url)};const reset=el("button","Reset draft");reset.onclick=()=>{state.brand="OSIRIS EYE";state.flags={monitoring:true,managedNodes:false,billing:false};render()};actions.append(exportBtn,reset);content.append(actions)}
render();
</script></body></html>
