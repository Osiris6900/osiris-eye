<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>OSIRIS EYE · Control Centre</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf5ff;background:#050b1a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 10%,#20215c 0,transparent 40%),#050b1a;min-height:100vh}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{min-width:0;border-right:1px solid #30415b;background:#080f21b8;padding:28px 15px}.logo{font-weight:900;font-size:24px;letter-spacing:2px;color:#f4fbff}.logo span{color:#61e8f9}.sub{color:#7f96b4;font-size:11px;letter-spacing:1px;margin:7px 0 35px}.side button{display:block;width:100%;text-align:left;background:none;color:#a7b8d3;border:1px solid transparent;border-radius:12px;padding:13px;margin:5px 0;cursor:pointer}.side button[aria-current="page"],.side button:hover{color:white;background:#22205d;border-color:#6551c8}.main{min-width:0;padding:30px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.eyebrow{color:#4dd8ee;font-size:11px;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(26px,3vw,42px);margin:7px 0 4px}p{color:#94a8c6}.pill{border:1px solid #455478;border-radius:99px;padding:9px 15px;color:#a8c4e5;font-size:12px}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:25px;align-items:center;margin:26px 0;padding:28px;border:1px solid #3c4c78;border-radius:22px;background:linear-gradient(120deg,#102242cc,#171342b8);box-shadow:0 18px 60px #0005}.hero h2{font-size:clamp(23px,3vw,38px);line-height:1.15}.globe{height:255px;display:grid;place-items:center;position:relative;overflow:hidden}.sphere{width:215px;height:215px;border-radius:50%;border:2px solid #36dafa;box-shadow:0 0 30px #2979ff, inset -30px -15px 55px #382ca9, inset 20px 10px 30px #18cbf077;background:repeating-linear-gradient(0deg,transparent 0 23px,#38bdf833 24px 25px),repeating-linear-gradient(90deg,transparent 0 32px,#38bdf82c 33px 34px),radial-gradient(circle at 35% 30%,#2477c9,#0c1740 70%);animation:float 6s ease-in-out infinite}.orbit{position:absolute;width:290px;height:95px;border:1px solid #b166f5;border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 14px #7942de}@keyframes float{50%{transform:translateY(-9px)}}@media(prefers-reduced-motion:reduce){.sphere{animation:none}}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.tile,.panel{background:#0e1930cc;border:1px solid #2a4264;border-radius:16px;padding:19px}.tile small{color:#91a7c7}.tile strong{display:block;font-size:23px;margin:14px 0 5px}.tile em{font-size:11px;font-style:normal;color:#5bd8ea}.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}.panel h3{margin:0 0 16px}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{padding:17px;border:1px solid #365074;border-radius:12px;background:#142442;display:flex;justify-content:space-between;align-items:center}.module b{font-size:13px}.module small{color:#90a5c6}.button{background:linear-gradient(100deg,#1568c6,#6d39b7);border:1px solid #7c83ff;color:white;border-radius:10px;padding:11px 14px;cursor:pointer}.button:focus-visible,.side button:focus-visible{outline:2px solid #56e8ff;outline-offset:2px}.settings{display:grid;gap:12px}.setting{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #263955;padding:10px 0}.muted{font-size:12px;color:#8ca2c1}.hidden{display:none!important}.notice{color:#f4ce8a;font-size:12px;margin-top:14px}.status{color:#62e4bf}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.lower{grid-template-columns:1fr}}@media(max-width:650px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;padding:15px}.side nav{display:flex;overflow:auto;gap:6px}.side button{white-space:nowrap}.main{padding:17px}.grid{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:1fr}.globe{height:210px}.sphere{width:165px;height:165px}.orbit{width:235px}}
input[type=password]{background:#0e1930;border:1px solid #365074;border-radius:10px;color:#eaf5ff}label{color:#91a7c7;font-size:12px;letter-spacing:1px;text-transform:uppercase}</style><body><div id="root"></div><noscript><p style="font-family:system-ui;color:#eaf5ff;padding:2rem">OSIRIS EYE Control Centre requires JavaScript. Authenticated read-only admin dashboard; no live trading.</p></noscript><script type="module" src="/src/admin.tsx"></script></body></html>
