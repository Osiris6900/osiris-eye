[package]
name = "osiris-p2p-node"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "First peer-to-peer node for the OSIRIS EYE network"

[[bin]]
name = "osiris-p2p-node"
path = "src/main.rs"

[dependencies]
futures = "0.3"
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "kad", "mdns", "identify", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "io-std", "time"] }
