[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="osiris-quant-api"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1","pydantic>=2.6,<3","numpy>=1.26,<3"]
[project.optional-dependencies]
ibkr=["ib_async>=2.0,<3"]
dev=["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.3,<1"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
[tool.ruff]
line-length=100
target-version="py311"

[tool.vercel]
entrypoint="src.osiris_api.main:app"
