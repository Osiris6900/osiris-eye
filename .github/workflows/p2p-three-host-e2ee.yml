name: P2P real three-host recipient-only E2EE acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p2p-three-host-e2ee
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

# Coordinated hosts must be rerun together; each attempt has fresh artifacts.
jobs:
  host-a:
    name: Host A - sender/controller
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Connect to private test overlay
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-p2p
      - name: Build P2P binary
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Create ephemeral SSH key and Host A endpoint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osiris-3host"
          chmod 700 "$RUNNER_TEMP/osiris-3host"
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/osiris-3host/host-a"
          printf '{"ip":"%s"}\n' "$(tailscale ip -4 | head -n1)" > "$RUNNER_TEMP/osiris-3host/host-a.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-a-pub-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host/host-a.pub
          retention-days: 1
      - name: Wait for Host B and C endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in "three-e2ee-b-endpoint-${{ github.run_id }}-${{ github.run_attempt }}" "three-e2ee-c-endpoint-${{ github.run_id }}-${{ github.run_attempt }}"; do
            python3 scripts/p2p_workflow_coordination.py wait-artifact --name "$artifact" --timeout 600
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: three-e2ee-b-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: three-e2ee-c-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host
      - name: Pin SSH host keys and run three-host E2EE test
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/osiris-3host"
          b="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["ip"])' "$dir/host-b.json")"
          c="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["ip"])' "$dir/host-c.json")"
          python3 scripts/p2p_workflow_coordination.py known-hosts \
            --path "$dir/known_hosts" --endpoint "$dir/host-b.json" --endpoint "$dir/host-c.json"
          python3 scripts/test_p2p_three_host_e2ee_ssh.py \
            --ssh-target-b "runner@$b" --ssh-target-c "runner@$c" \
            --host-a-ip "$(tailscale ip -4 | head -n1)" --port 4001 \
            --remote-binary "$GITHUB_WORKSPACE/target/release/osiris-p2p-node" \
            --evidence "$dir/e2ee-evidence.json" \
            --require-distinct-hosts \
            --ssh-option=-i --ssh-option="$dir/host-a" \
            --ssh-option=-o --ssh-option=BatchMode=yes \
            --ssh-option=-o --ssh-option=StrictHostKeyChecking=yes \
            --ssh-option=-o --ssh-option="UserKnownHostsFile=$dir/known_hosts" \
            --ssh-option=-o --ssh-option=ConnectTimeout=15
      - name: Retain recipient E2EE binary hashes and acceptance record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host/e2ee-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record controller completion
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          python3 scripts/p2p_workflow_coordination.py write-result \
            --path "$RUNNER_TEMP/osiris-3host/result.json" --status "$TEST_STATUS"
      - name: Release receivers after test completion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-controller-finished-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host/result.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-a-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # Never upload the ephemeral SSH private key (host-a).
          path: |
            ${{ runner.temp }}/osiris-3host/host-a.json
            ${{ runner.temp }}/osiris-3host/known_hosts
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove ephemeral SSH client key
        if: always()
        run: rm -f "$RUNNER_TEMP/osiris-3host/host-a"

  host-b:
    name: Host B - intended recipient
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-p2p
      - name: Build receiver
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Wait for sender SSH key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "three-e2ee-a-pub-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 600
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: three-e2ee-a-pub-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host
      - name: Start SSH receiver and publish endpoint
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/osiris-3host"
          mkdir -p "$dir" "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          sudo apt-get update && sudo apt-get install -y openssh-server
          printf 'restrict ' > "$HOME/.ssh/authorized_keys"
          cat "$dir/host-a.pub" >> "$HOME/.ssh/authorized_keys"; chmod 600 "$HOME/.ssh/authorized_keys"
          sudo ssh-keygen -A; sudo /usr/sbin/sshd
          ip="$(tailscale ip -4 | head -n1)"; test -n "$ip"
          for _ in $(seq 1 30); do timeout 2 bash -c ":</dev/tcp/$ip/22" 2>/dev/null && break; sleep 1; done
          timeout 5 bash -c ":</dev/tcp/$ip/22"
          python3 scripts/p2p_workflow_coordination.py write-endpoint \
            --path "$dir/host-b.json" --ip "$ip" \
            --host-key /etc/ssh/ssh_host_ed25519_key.pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-b-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host/host-b.json
          retention-days: 1
      - name: Keep Host B online until controller completes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "three-e2ee-controller-finished-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 900
      - name: Remove ephemeral SSH authorization
        if: always()
        run: rm -f "$HOME/.ssh/authorized_keys"

  host-c:
    name: Host C - non-recipient observer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-p2p
      - name: Build observer
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Wait for sender SSH key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "three-e2ee-a-pub-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 600
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: three-e2ee-a-pub-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host
      - name: Start SSH receiver and publish endpoint
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/osiris-3host"
          mkdir -p "$dir" "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          sudo apt-get update && sudo apt-get install -y openssh-server
          printf 'restrict ' > "$HOME/.ssh/authorized_keys"
          cat "$dir/host-a.pub" >> "$HOME/.ssh/authorized_keys"; chmod 600 "$HOME/.ssh/authorized_keys"
          sudo ssh-keygen -A; sudo /usr/sbin/sshd
          ip="$(tailscale ip -4 | head -n1)"; test -n "$ip"
          for _ in $(seq 1 30); do timeout 2 bash -c ":</dev/tcp/$ip/22" 2>/dev/null && break; sleep 1; done
          timeout 5 bash -c ":</dev/tcp/$ip/22"
          python3 scripts/p2p_workflow_coordination.py write-endpoint \
            --path "$dir/host-c.json" --ip "$ip" \
            --host-key /etc/ssh/ssh_host_ed25519_key.pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-e2ee-c-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-3host/host-c.json
          retention-days: 1
      - name: Keep Host C online until controller completes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "three-e2ee-controller-finished-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 900
      - name: Remove ephemeral SSH authorization
        if: always()
        run: rm -f "$HOME/.ssh/authorized_keys"
