name: 179 evidence contract tests

on:
  pull_request:
    paths:
      - "scripts/check_paper_failure_matrix.py"
      - "scripts/test_check_paper_failure_matrix.py"
      - "scripts/run_paper_failure_exercise.py"
      - "scripts/test_run_paper_failure_exercise.py"
      - "docs/**"
      - ".github/workflows/179-evidence-contract.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_paper_failure_exercise.py"
      - "scripts/test_run_paper_failure_exercise.py"
      - "scripts/check_paper_failure_matrix.py"
      - ".github/workflows/179-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run fail-closed evidence validator tests
        run: python -m unittest discover -s scripts -p 'test_check_paper_failure_matrix.py' -v
      - name: Install real paper-only ledger code
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -e services/quant-api
      - name: Run real isolated paper-ledger failure regressions
        run: python -m unittest discover -s scripts -p 'test_run_paper_failure_exercise.py' -v
      - name: Execute isolated failure matrix and validate report contract
        run: |
          python scripts/run_paper_failure_exercise.py \
            --output-dir "$RUNNER_TEMP/osiris-paper-failure-matrix" \
            --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/check_paper_failure_matrix.py \
            "$RUNNER_TEMP/osiris-paper-failure-matrix/paper-failure-matrix.json"
      - name: Retain synthetic paper failure-injection evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-failure-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-paper-failure-matrix/
          if-no-files-found: error
          retention-days: 14
