name: Release gate inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/release-gate-status.json"
      - "docs/INTEGRATED_DELIVERY_GATES_2026_11_08.md"
      - "scripts/check_release_gate_status.py"
      - "scripts/test_check_release_gate_status.py"
      - ".github/workflows/release-gate-inventory.yml"
  push:
    branches: [main]
    paths:
      - "docs/release-gate-status.json"
      - "docs/INTEGRATED_DELIVERY_GATES_2026_11_08.md"
      - "scripts/check_release_gate_status.py"
      - "scripts/test_check_release_gate_status.py"
      - ".github/workflows/release-gate-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check release-gate inventory
        run: |
          python scripts/check_action_pins.py
          python -m unittest discover -s scripts -p 'test_check_action_pins.py' -v
          python scripts/check_release_gate_status.py
          python -m unittest discover -s scripts -p 'test_check_release_gate_status.py' -v

  strict-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify every release acceptance gate
        run: |
          python scripts/check_action_pins.py
          python -m unittest discover -s scripts -p 'test_check_action_pins.py' -v
          python scripts/check_release_gate_status.py --strict
          python -m unittest discover -s scripts -p 'test_check_release_gate_status.py' -v
