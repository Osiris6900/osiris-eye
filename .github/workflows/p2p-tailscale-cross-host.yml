name: P2P Tailscale cross-host acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: p2p-tailscale-cross-host-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

# Coordinated hosts must be rerun together; each attempt has fresh artifacts.
jobs:
  host-a:
    # Never execute PR/fork code after attaching secret-authenticated networking.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Host A - Tailscale P2P listener
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-p2p
      - name: Build P2P node
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Start listener and publish endpoint for Host B
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/target/release/osiris-p2p-node"
          NODE_LOG="$RUNNER_TEMP/osiris-host-a.log"
          NODE_KEY="$RUNNER_TEMP/osiris-host-a.key"
          HEALTH_PORT=19090
          TAILSCALE_IP="$(tailscale ip -4 | head -n1)"
          test -n "$TAILSCALE_IP"
          nohup env \
            OSIRIS_NODE_KEY="$NODE_KEY" \
            OSIRIS_LISTEN_ADDR="/ip4/0.0.0.0/tcp/4001" \
            OSIRIS_EXTERNAL_ADDRS="/ip4/$TAILSCALE_IP/tcp/4001" \
            OSIRIS_HEALTH_HTTP_ADDR="127.0.0.1:$HEALTH_PORT" \
            "$BIN" >"$NODE_LOG" 2>&1 </dev/null &
          echo "$!" > "$RUNNER_TEMP/osiris-host-a.pid"

          PEER_ID=""
          for _ in $(seq 1 90); do
            if curl --silent --fail "http://127.0.0.1:$HEALTH_PORT/health" > "$RUNNER_TEMP/health.json"; then
              PEER_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["peer_id"])' "$RUNNER_TEMP/health.json")"
              if [ -n "$PEER_ID" ] && ss -ltn | grep -q ':4001 '; then break; fi
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/osiris-host-a.pid")" 2>/dev/null; then
              echo "P2P node exited before health endpoint became ready."
              cat "$NODE_LOG" || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$PEER_ID" ] || ! ss -ltn | grep -q ':4001 '; then
            echo "Host A listener did not become ready."
            cat "$NODE_LOG" || true
            exit 1
          fi
          printf '{"tailscale_ip":"%s","port":4001,"peer_id":"%s"}\n' "$TAILSCALE_IP" "$PEER_ID" > "$RUNNER_TEMP/p2p-endpoint.json"
          echo "Host A Tailscale endpoint ready: $TAILSCALE_IP:4001 peer=$PEER_ID"
      - name: Share endpoint with Host B
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2p-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2p-endpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for Host B readiness after its build and network diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "p2p-host-b-ready-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 600
      - name: Wait for Host B observation to arrive
        run: |
          set -euo pipefail
          NODE_LOG="$RUNNER_TEMP/osiris-host-a.log"
          INSTRUMENT="OSIRIS-TAILSCALE-STRESS"
          MESSAGE_COUNT=20
          for sequence in $(seq 1 "$MESSAGE_COUNT"); do
            PAYLOAD="tailscale cross-host p2p stress probe $sequence"
            DIGEST="$(printf '%s' "$PAYLOAD" | sha256sum | cut -d' ' -f1)"
            RECEIVED=0
            for _ in $(seq 1 240); do
              if grep -F "observation_received" "$NODE_LOG" | grep -F "instrument=$INSTRUMENT" | grep -F "payload_sha256=$DIGEST" >/dev/null; then
                RECEIVED=1
                break
              fi
              sleep 1
            done
            if [ "$RECEIVED" -ne 1 ]; then
              echo "Missing stress message sequence=$sequence digest=$DIGEST"
              cat "$NODE_LOG"
              exit 1
            fi
            echo "CROSS_HOST_P2P_MESSAGE_RECEIVED=$sequence"
          done
          echo "CROSS_HOST_P2P_STRESS_MESSAGES=$MESSAGE_COUNT"
          echo "CROSS_HOST_P2P_STRESS=PASS"
      - name: Record Host A acceptance result
        if: always()
        env:
          TEST_STATUS: ${{ job.status }}
        run: |
          python3 scripts/p2p_workflow_coordination.py write-result \
            --path "$RUNNER_TEMP/p2p-host-a-result.json" --status "$TEST_STATUS"
      - name: Share Host A completion with Host B
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2p-host-a-finished-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2p-host-a-result.json
          if-no-files-found: error
          retention-days: 1
      - name: Stop Host A node
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/osiris-host-a.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/osiris-host-a.pid")" 2>/dev/null || true
          fi

  host-b:
    # Never execute PR/fork code after attaching secret-authenticated networking.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Host B - Tailscale P2P client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-p2p
      - name: Build P2P node
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Wait until Host A uploads its endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "p2p-endpoint-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 600
      - name: Download Host A endpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p2p-endpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Diagnose Tailscale path and TCP listener
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -u
          ENDPOINT="$RUNNER_TEMP/p2p-endpoint.json"
          TAILSCALE_IP="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tailscale_ip"])' "$ENDPOINT")"
          echo "=== Tailscale status ==="
          tailscale status || true
          echo "=== Route to Host A ==="
          ip route get "$TAILSCALE_IP" || true
          echo "=== Tailscale ping ==="
          PING_STATUS=0
          tailscale ping --timeout=10s "$TAILSCALE_IP" || PING_STATUS=$?
          echo "=== TCP port 4001 ==="
          TCP_STATUS=0
          nc -vz -w 8 "$TAILSCALE_IP" 4001 || TCP_STATUS=$?
          echo "TAILSCALE_PING_EXIT=$PING_STATUS"
          echo "TCP_4001_EXIT=$TCP_STATUS"
          if [ "$PING_STATUS" -ne 0 ] || [ "$TCP_STATUS" -ne 0 ]; then
            echo "Network-layer diagnosis failed; stopping before Libp2p handshake."
            exit 1
          fi
      - name: Record Host B readiness
        run: |
          python3 scripts/p2p_workflow_coordination.py write-result \
            --path "$RUNNER_TEMP/p2p-host-b-ready.json" --status success
      - name: Notify Host A that Host B is ready
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2p-host-b-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2p-host-b-ready.json
          if-no-files-found: error
          retention-days: 1
      - name: Connect and publish integrity probe
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ENDPOINT="$RUNNER_TEMP/p2p-endpoint.json"
          TAILSCALE_IP="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tailscale_ip"])' "$ENDPOINT")"
          PEER_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["peer_id"])' "$ENDPOINT")"
          BOOTSTRAP="/ip4/$TAILSCALE_IP/tcp/4001/p2p/$PEER_ID"
          BIN="$GITHUB_WORKSPACE/target/release/osiris-p2p-node"
          NODE_LOG="$RUNNER_TEMP/osiris-host-b.log"
          NODE_KEY="$RUNNER_TEMP/osiris-host-b.key"
          FIFO="$RUNNER_TEMP/osiris-host-b.stdin"
          mkfifo "$FIFO"
          OSIRIS_NODE_KEY="$NODE_KEY" \
          OSIRIS_BOOTSTRAP_PEERS="$BOOTSTRAP" \
          OSIRIS_LISTEN_ADDR="/ip4/0.0.0.0/tcp/0" \
          OSIRIS_HEALTH_HTTP_ADDR="127.0.0.1:19091" \
            "$BIN" < "$FIFO" >"$NODE_LOG" 2>&1 &
          NODE_PID=$!
          echo "$NODE_PID" > "$RUNNER_TEMP/osiris-host-b.pid"
          exec 3>"$FIFO"

          CONNECTED=0
          for _ in $(seq 1 120); do
            if grep -F "peer_connected=$PEER_ID" "$NODE_LOG" >/dev/null; then CONNECTED=1; break; fi
            if ! kill -0 "$NODE_PID" 2>/dev/null; then cat "$NODE_LOG"; exit 1; fi
            sleep 1
          done
          if [ "$CONNECTED" -ne 1 ]; then
            echo "Host B failed to connect to Host A over Tailscale."
            cat "$NODE_LOG"
            exit 1
          fi

          SUBSCRIBED=0
          for _ in $(seq 1 60); do
            if grep -F "gossipsub_subscribed peer=$PEER_ID" "$NODE_LOG" >/dev/null; then SUBSCRIBED=1; break; fi
            sleep 1
          done
          if [ "$SUBSCRIBED" -ne 1 ]; then
            echo "GossipSub subscription was not observed."
            cat "$NODE_LOG"
            exit 1
          fi

          MESSAGE_COUNT=20
          for sequence in $(seq 1 "$MESSAGE_COUNT"); do
            PAYLOAD="tailscale cross-host p2p stress probe $sequence"
            DIGEST="$(printf '%s' "$PAYLOAD" | sha256sum | cut -d' ' -f1)"
            printf '{"schema":"osiris.observation.v1","instrument":"OSIRIS-TAILSCALE-STRESS","observed_at":"2026-11-03T11:00:00Z","provider":"osiris-tailscale-ci","payload_sha256":"%s","payload":"%s"}\n' "$DIGEST" "$PAYLOAD" >&3
            sleep 0.25
          done
          echo "Host B published $MESSAGE_COUNT stress messages to Host A."
          exec 3>&-
      - name: Wait for Host A to verify every published observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/p2p_workflow_coordination.py wait-artifact \
            --name "p2p-host-a-finished-${{ github.run_id }}-${{ github.run_attempt }}" --timeout 600
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p2p-host-a-finished-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Require successful receiver acceptance
        run: |
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["status"] == "success" else 1)' "$RUNNER_TEMP/p2p-host-a-result.json"
      - name: Stop Host B node
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/osiris-host-b.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/osiris-host-b.pid")" 2>/dev/null || true
          fi
