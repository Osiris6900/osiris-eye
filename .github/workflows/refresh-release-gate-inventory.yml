name: Refresh release-gate inventory facts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_release_gate_status.py'
      - 'docs/release-gate-status.json'
      - '.github/workflows/refresh-release-gate-inventory.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' # avoid PR-triggered bot commits racing with validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/release-gate-evidence-url-validation-20261109
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Refresh inventory facts against this worktree
        run: |
          python scripts/check_release_gate_status.py --refresh-facts
          python scripts/check_release_gate_status.py
      - name: Commit refreshed inventory
        run: |
          if ! git diff --quiet -- docs/release-gate-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/release-gate-status.json
            git commit -m "docs(release): synchronize release gate inventory facts"
            git push origin HEAD:fix/release-gate-evidence-url-validation-20261109
          fi
