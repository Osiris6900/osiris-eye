name: Remediate Rust SQLite advisory (isolated branch)
on:
  push:
    branches:
      - fix/rust-sqlite-audit-20261109
    paths:
      - '.github/workflows/rust-sqlite-remediation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/rust-sqlite-audit-20261109
          persist-credentials: true
      - name: Upgrade rusqlite and regenerate lockfile
        working-directory: services/p2p-node
        run: |
          cargo add rusqlite@latest --features bundled
          cargo update
          cargo test --locked
      - name: Verify RustSec advisory
        run: |
          cargo install cargo-audit --locked
          cargo audit --file services/p2p-node/Cargo.lock
      - name: Commit tested dependency remediation
        run: |
          if ! git diff --quiet -- services/p2p-node/Cargo.toml services/p2p-node/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/p2p-node/Cargo.toml services/p2p-node/Cargo.lock
            git commit -m "fix(security): upgrade rusqlite and regenerate verified lockfile"
            git push origin HEAD:fix/rust-sqlite-audit-20261109
          fi
