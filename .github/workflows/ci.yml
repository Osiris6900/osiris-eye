name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/quant-api/pyproject.toml
      - name: Install API and test dependencies
        run: pip install -e "services/quant-api[dev]"
      - name: Run Python tests
        run: pytest -q services/quant-api/tests
      - name: Syntax-check P2P acceptance helpers
        run: python -m py_compile scripts/test_p2p_cross_host_ssh.py scripts/test_p2p_core_trusted_peer_allowlist.py scripts/test_p2p_bootstrap_readiness.py scripts/test_p2p_bootstrap_restart.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust risk kernel
        run: cargo test --manifest-path crates/risk-kernel/Cargo.toml
      - name: Test decentralized P2P node
        run: cargo test --manifest-path services/p2p-node/Cargo.toml --all-targets
      - name: Build P2P node for process-level tests
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Verify two OS processes exchange a P2P observation
        run: python scripts/test_p2p_two_process.py
      - name: Verify core node rejects peers outside trusted allowlist
        run: python scripts/test_p2p_core_trusted_peer_allowlist.py
      - name: Verify local P2P HTTP health endpoint
        run: python scripts/test_p2p_http_health.py
      - name: Verify readiness changes with bootstrap connectivity
        run: python scripts/test_p2p_bootstrap_readiness.py
      - name: Verify bootstrap peer reconnects after process restart
        run: python scripts/test_p2p_bootstrap_restart.py
      - name: Verify relay server and two relay clients exchange an observation
        run: python scripts/test_p2p_three_process_relay.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Type-check and build web app
        working-directory: apps/web
        run: npm run build
