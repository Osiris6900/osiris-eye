name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/quant-api/pyproject.toml
      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          pip install -e "services/quant-api[dev]" 'PyYAML>=6,<7'
      - name: Verify immutable GitHub Actions references
        run: |
          python scripts/check_action_pinning.py
          python -m unittest discover -s scripts -p 'test_check_action_pinning.py' -v
      - name: Verify the read-only verification planner
        run: python scripts/test_verify_all.py
      - name: Run Python tests
        run: pytest -q services/quant-api/tests tests/test_ultra_fast_feed.py
      - name: Run connected market-to-paper acceptance with offline candles
        run: |
          python -m unittest discover -s scripts -p 'test_run_market_paper_acceptance.py' -v
          python scripts/run_market_paper_acceptance.py --output "${{ runner.temp }}/market-paper-acceptance.json"
      - name: Retain market-to-paper acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-paper-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/market-paper-acceptance.json
            ${{ runner.temp }}/market-paper-acceptance.json.sha256
          if-no-files-found: ignore
          retention-days: 14
      - name: Smoke-test bounded local tick benchmark
        run: |
          PYTHONPATH=services/quant-api/src python scripts/benchmark_ultra_fast_feed.py --count 1000

      - name: Validate workflow YAML and embedded Bash
        run: |
          python scripts/check_p2p_workflows.py
          python scripts/test_check_p2p_workflows.py
      - name: Validate CycloneDX SBOM includes the hashed Python lock
        run: python scripts/test_generate_dependency_sbom.py
      - name: Verify P2P coordination, SSH harness and deployment preflight
        run: |
          python scripts/test_p2p_workflow_coordination.py
          python scripts/test_p2p_ssh_harness.py
          python scripts/test_p2p_e2ee_acceptance_evidence.py
          python scripts/test_run_p2p_soak.py
          python scripts/test_check_p2p_capacity_evidence.py
          python scripts/test_check_p2p_load_acceptance.py
          python deploy/p2p/test_preflight.py
          python scripts/test_systemd_smoke_guards.py
      - name: Verify admin prototype disclosure guard offline
        run: |
          python scripts/check_admin_prototype.py
          python -m unittest discover -s scripts -p 'test_check_admin_prototype.py' -v
      - name: Validate public TCP probe without network access
        run: python -m unittest discover -s scripts -p 'test_probe_p2p_public_tcp.py' -v
      - name: Validate multi-vantage TCP evidence gate offline
        run: python -m unittest discover -s scripts -p 'test_check_p2p_public_evidence.py' -v
      - name: Validate sampled P2P outage evidence gate offline
        run: python -m unittest discover -s scripts -p 'test_check_p2p_outage_recovery.py' -v
      - name: Verify decentralized bootstrap configuration gate
        run: python -m unittest discover -s scripts -p 'test_check_decentralized_bootstrap.py' -v
      - name: Syntax-check P2P acceptance helpers
        run: python -m py_compile scripts/test_p2p_cross_host_ssh.py scripts/test_p2p_cross_host_e2ee_ssh.py scripts/test_p2p_core_trusted_peer_allowlist.py scripts/test_p2p_bootstrap_readiness.py scripts/test_p2p_bootstrap_restart.py scripts/test_p2p_global_revocation_sync.py scripts/test_p2p_e2ee_three_process.py scripts/test_p2p_delivery_receipts.py scripts/test_verified_receipt_rust_bridge.py scripts/test_p2p_three_host_e2ee_ssh.py scripts/test_p2p_live_swarm_revocation.py scripts/test_p2p_core_relay_e2ee.py scripts/test_p2p_observation_freshness.py scripts/p2p_e2ee_acceptance_evidence.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Test Rust risk kernel
        run: cargo test --manifest-path crates/risk-kernel/Cargo.toml
      - name: Test and build native mapped-file feed
        run: |
          cargo test --locked --manifest-path crates/native-feed/Cargo.toml
          cargo build --locked --manifest-path crates/native-feed/Cargo.toml
          OSIRIS_NATIVE_TEST_BINARY="$PWD/crates/native-feed/target/debug/osiris-native-feed" python scripts/test_native_feed_process.py
      - name: Test decentralized P2P node
        run: cargo test --locked --manifest-path services/p2p-node/Cargo.toml --all-targets
      - name: Verify Rust receipt events persist in the Python ledger
        run: python scripts/test_verified_receipt_rust_bridge.py
      - name: Build P2P node for process-level tests
        run: cargo build --locked --release --manifest-path services/p2p-node/Cargo.toml
      - name: Verify two OS processes exchange a P2P observation
        run: python scripts/test_p2p_two_process.py
      - name: Verify core node rejects peers outside trusted allowlist
        run: python scripts/test_p2p_core_trusted_peer_allowlist.py
      - name: Verify local P2P HTTP health endpoint
        run: python scripts/test_p2p_http_health.py
      - name: Verify readiness changes with bootstrap connectivity
        run: python scripts/test_p2p_bootstrap_readiness.py
      - name: Verify bootstrap peer reconnects after process restart
        run: python scripts/test_p2p_bootstrap_restart.py
      - name: Verify relay server and two relay clients exchange an observation
        run: python scripts/test_p2p_three_process_relay.py
      - name: Verify three-node authority-signed revocation synchronization
        run: python scripts/test_p2p_global_revocation_sync.py
      - name: Verify live swarm disconnects revoked peer and denies reconnect
        run: python scripts/test_p2p_live_swarm_revocation.py
      - name: Verify recipient E2EE and non-recipient rejection
        run: python scripts/test_p2p_e2ee_three_process.py
      - name: Verify signed E2EE receiver delivery receipts
        run: python scripts/test_p2p_delivery_receipts.py
      - name: Verify core-node E2EE through Circuit Relay v2
        run: python scripts/test_p2p_core_relay_e2ee.py --evidence "${{ runner.temp }}/core-relay-e2ee.json"
      - name: Verify observation freshness and fail-closed configuration
        run: python scripts/test_p2p_observation_freshness.py
      - name: Verify hardened systemd startup, restart and durable identity
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          NODE_BINARY="${CARGO_TARGET_DIR:-services/p2p-node/target}/release/osiris-p2p-node"
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 scripts/test_p2p_systemd_profile.py \
            --binary "$NODE_BINARY" --evidence "$RUNNER_TEMP/systemd-profile-smoke.json"
      - name: Retain sanitized systemd operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: systemd-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/systemd-profile-smoke.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain core relay acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-relay-e2ee-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-relay-e2ee.json
          if-no-files-found: ignore
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run frontend behavior tests
        working-directory: apps/web
        run: npm test
      - name: Type-check and build web app
        working-directory: apps/web
        run: npm run build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify browser MFA, independent review and HTTPS worker completion
        env:
          OSIRIS_BROWSER_ARTIFACTS: ${{ runner.temp }}/platform20-browser
        run: |
          python -m pip install -e "services/quant-api[dev]"
          bash scripts/run_platform20_browser.sh
      - name: Retain sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform20-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform20-browser/dashboard-browser.png
            ${{ runner.temp }}/platform20-browser/platform20-browser.png
            ${{ runner.temp }}/platform20-browser/platform20-browser.json
          if-no-files-found: ignore
          retention-days: 14
