name: Staging deployment readiness (no production writes)

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Confirm this is a staging-only verification; no deployment is performed"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/staging-deployment-readiness.yml"

permissions:
  contents: read

concurrency:
  group: staging-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.confirm_staging == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify repository and Python tests
        run: |
          python -m pip install -e "services/quant-api[dev]"
          python -m pytest -q services/quant-api/tests
      - name: Build and test P2P node
        run: |
          cargo test --locked --manifest-path services/p2p-node/Cargo.toml --all-targets
          cargo build --locked --release --manifest-path services/p2p-node/Cargo.toml
          test -x services/p2p-node/target/release/osiris-p2p-node
      - name: Verify local P2P health and receipt checks
        run: |
          python scripts/test_p2p_http_health.py
          python scripts/test_p2p_delivery_receipts.py
      - name: Explain deployment boundary
        run: |
          echo "Staging readiness only: no remote server credentials, upload, service restart or production deployment."
          echo "Actual deployment requires a configured staging target, least-privilege credentials, health gate and rollback."
