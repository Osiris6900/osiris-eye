name: Synthetic model research evidence (T11/T12 only)

on:
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - "scripts/record_model_research_evidence.py"
      - "scripts/test_record_model_research_evidence.py"
      - ".github/workflows/model-research-evidence.yml"
      - "services/quant-api/src/osiris_api/walk_forward.py"
      - "services/quant-api/src/osiris_api/authorized_feeds.py"
  push:
    branches: [main]
    paths:
      - "scripts/record_model_research_evidence.py"
      - "scripts/test_record_model_research_evidence.py"
      - ".github/workflows/model-research-evidence.yml"
      - "services/quant-api/src/osiris_api/walk_forward.py"
      - "services/quant-api/src/osiris_api/authorized_feeds.py"

permissions:
  contents: read

jobs:
  synthetic-archive:
    name: Synthetic-only research archive (not model signoff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deterministic paper-research library
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -e services/quant-api
      - name: Validate synthetic archive and tamper detection
        run: python -m unittest discover -s scripts -p 'test_record_model_research_evidence.py' -v
      - name: Write reproducible synthetic walk-forward archive
        run: |
          python scripts/record_model_research_evidence.py \
            --output-dir "$RUNNER_TEMP/osiris-model-research-evidence" \
            --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Retain synthetic-only model research bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-model-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-model-research-evidence/
          if-no-files-found: error
          retention-days: 14
