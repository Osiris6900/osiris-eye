name: Deployment recovery dry run

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Dry-run evidence scenario (no recovery operation executed)'
        required: false
        type: choice
        default: full
        options:
          - full
          - backup-only
          - restore-only
          - dr-failover
  pull_request:
    paths:
      - "scripts/check_deploy_recovery.py"
      - "scripts/test_check_deploy_recovery.py"
      - "scripts/run_paper_dr_exercise.py"
      - "scripts/verify_paper_dr_artifacts.py"
      - "scripts/test_verify_paper_dr_artifacts.py"
      - ".github/workflows/deploy-recovery-dry-run.yml"
      - "docs/evidence/deploy-recovery.schema.json"
  push:
    branches: [main]
    paths:
      - "scripts/check_deploy_recovery.py"
      - "scripts/test_check_deploy_recovery.py"
      - "scripts/run_paper_dr_exercise.py"
      - ".github/workflows/deploy-recovery-dry-run.yml"
      - "docs/evidence/deploy-recovery.schema.json"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate recovery plan shape without executing it
        run: |
          python -m unittest discover -s scripts -p 'test_check_deploy_recovery.py' -v
          python scripts/check_deploy_recovery.py docs/evidence/deploy-recovery.example.json

  local-paper-ledger-dr:
    name: Isolated paper-ledger backup/restore exercise (not production DR)
    # Only the operator dispatches the workflow. PR/push CI may exercise
    # synthetic throwaway state; non-full dispatch choices stay schema-only.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scenario == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install paper-only ledger code
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -e services/quant-api
      - name: Exercise isolated SQLite backup, restore and same-runner standby
        run: |
          python scripts/run_paper_dr_exercise.py --output-dir "$RUNNER_TEMP/osiris-paper-dr"
      - name: Verify retained local artifact integrity and test tamper rejection
        run: |
          python -m unittest discover -s scripts -p 'test_verify_paper_dr_artifacts.py' -v
          python scripts/verify_paper_dr_artifacts.py "$RUNNER_TEMP/osiris-paper-dr"
      - name: Retain sanitized synthetic drill proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-ledger-local-dr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osiris-paper-dr/
          if-no-files-found: error
          retention-days: 14
