name: Immutable GitHub Actions pin ratchet

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_action_pins.py"
      - "scripts/test_check_action_pins.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_action_pins.py"
      - "scripts/test_check_action_pins.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Enforce immutable third-party action references
        run: |
          python scripts/check_action_pins.py
          python -m unittest discover -s scripts -p 'test_check_action_pins.py' -v
