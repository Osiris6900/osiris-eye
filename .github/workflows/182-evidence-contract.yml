name: 182 evidence contract tests

on:
  pull_request:
    paths:
      - "scripts/check_cross_module_acceptance.py"
      - "scripts/test_check_cross_module_acceptance.py"
      - "docs/**"
      - ".github/workflows/182-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run fail-closed evidence validator tests
        run: python -m unittest discover -s scripts -p 'test_check_cross_module_acceptance.py' -v
