name: Unified bridge real-node E2E

on:
  pull_request:
    paths:
      - "scripts/test_p2p_unified_bridge_two_process.py"
      - "services/quant-api/src/osiris_api/unified_observation_bridge.py"
      - "services/quant-api/src/osiris_api/observation_outbox.py"
      - "services/quant-api/src/osiris_api/p2p_ingestion.py"
      - "services/quant-api/src/osiris_api/data_store.py"
      - "services/quant-api/tests/test_observation_outbox.py"
      - "services/quant-api/tests/test_unified_outbox_policy.py"
      - "services/quant-api/tests/test_atomic_observation_outbox.py"
      - "services/quant-api/tests/test_research_store_transactions.py"
      - ".github/workflows/unified-bridge-node-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validated-gossip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Python bridge
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -e services/quant-api
      - name: Build P2P node
        run: cargo build --release --manifest-path services/p2p-node/Cargo.toml
      - name: Verify validated bridge to separate real node
        run: python scripts/test_p2p_unified_bridge_two_process.py
