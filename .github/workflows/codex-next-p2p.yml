name: Start next P2P milestone with Codex

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-next-p2p-milestone
  cancel-in-progress: false

jobs:
  next-p2p-milestone:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.title, 'P2P')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the updated main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Rust dependencies before the sandboxed agent runs
        run: cargo fetch --manifest-path services/p2p-node/Cargo.toml

      - name: Run Codex to implement the next P2P milestone
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          effort: high
          output-file: codex-next-p2p-summary.md
          prompt: |
            You are the autonomous implementation agent for Osiris Eye's Rust/libp2p P2P network.

            A P2P milestone PR has just merged into main. Inspect the repository state, especially:
            - services/p2p-node/src/main.rs
            - services/p2p-node/src/bin/relay-client.rs
            - scripts/test_p2p_*.py
            - docs/P2P_PUBLIC_NODE_DEPLOYMENT.md
            - .github/workflows/ci.yml

            Implement exactly ONE next, concrete, high-value P2P engineering milestone that is not already implemented. Prefer operational reliability, observable peer/DHT health, stronger deterministic acceptance tests, or safe network configuration. Do not merely rewrite documentation.

            Requirements:
            1. First inspect existing code and tests; do not duplicate existing features.
            2. Keep the change small, production-minded, and backward compatible.
            3. Add or update meaningful Rust unit/integration tests and, where appropriate, a process-level acceptance test.
            4. Update relevant P2P documentation.
            5. Do not claim Internet-wide reachability from localhost tests.
            6. Do not add credentials, API keys, or secrets to files or logs.
            7. Do not modify this workflow or the Codex prompt/configuration.
            8. Do not merge anything. The workflow will open a PR; normal CI and human/repository safeguards remain in force.
            9. If no safe, non-duplicate milestone can be identified, make no code changes and explain why.

            Run the relevant local checks that are available. Summarize exactly what changed, tests run, and remaining limitations in codex-next-p2p-summary.md.
      
      - name: Run Rust validation
        run: |
          cargo fmt --all -- --check
          cargo test --manifest-path crates/risk-kernel/Cargo.toml
          cargo test --manifest-path services/p2p-node/Cargo.toml --all-targets

      - name: Create a pull request for the next milestone
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: codex/next-p2p-milestone
          delete-branch: true
          title: "P2P: next autonomous network milestone"
          body-path: codex-next-p2p-summary.md
          commit-message: "feat(p2p): implement next autonomous milestone"
          add-paths: |
            services/p2p-node/**
            scripts/test_p2p_*.py
            docs/P2P_PUBLIC_NODE_DEPLOYMENT.md
          labels: |
            p2p
            automated
